# XcodeGen spec — run `xcodegen generate` on a Mac to produce Scribe.xcodeproj.
# Install XcodeGen with: brew install xcodegen
name: Scribe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team in Xcode (Signing & Capabilities) before running on a device.
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Scribe:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scribe
        PRODUCT_NAME: Scribe
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES

  ScribeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Scribe
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.scribe.tests
        GENERATE_INFOPLIST_FILE: YES
